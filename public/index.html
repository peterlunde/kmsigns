function browse(){let parts=folder==='*'?[]:folder.split('/').filter(Boolean),depth=parts.length,items=db.products.filter(p=>!folder||folder==='*'||(depth===1?p.gender===folder:p.gender+'/'+p.category===folder));if(query)items=(mode==='print'?items:db.products).filter(p=>(p.name+' '+p.style).toLowerCase().includes(query.toLowerCase()));let show=(mode==='print'?!!folder:depth===2)||!!query;let html=intro(t(mode),t(mode==='images'?'imageHelp':mode==='print'?'printHelp':'infoHelp'))+'<input class="search" type="search" id="search" placeholder="'+t('search')+'" value="'+esc(query)+'"><nav class="crumbs"><button data-folder="">'+t(mode==='print'?'browseGroups':'all')+'</button>'+(folder==='*'?' / '+t('viewAll'):'')+(parts[0]?' / <button data-folder="'+esc(parts[0])+'">'+t(parts[0])+'</button>':'')+(parts[1]?' / '+esc(cat(parts[1])):'')+'</nav>';

else{if(mode==='print')html+='<div class="row between" style="margin-bottom:22px"><button class="primary" id="select-all">'+t(folder==='*'&&!query?'selectAll':'selectShown')+'</button><button class="link" id="clear">'+t('clear')+'</button></div><p class="sub">'+t(folder==='*'&&!query?'selectionHelp':'filteredHelp')+'</p>';if(mode==='info')html+='<p><button id="fetch-points">'+t('fetch')+'</button></p>';if(mode==='images')html+='<p><label><input type="checkbox" id="remove-bg" '+(removeBg?'checked':'')+'> '+t('removeBg')+'</label></p>';html+='<div class="grid">'+items.map(card).join('')+'</div>'}
$('#app').innerHTML=html;$('#search').oninput=e=>{query=e.target.value;clearTimeout(window.searchTimer);window.searchTimer=setTimeout(()=>{browse();let i=$('#search');i.focus();i.setSelectionRange(i.value.length,i.value.length)},240)};document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;query='';render()});$('#remove-bg')?.addEventListener('change',e=>removeBg=e.target.checked);$('#select-all')?.addEventListener('click',()=>{items.forEach(p=>{if(p.variants.length&&qty(p)===0)selected[p.id]={mode:'exact',counts:{[p.variants[0].id]:1}}});persistQueue();render()});$('#clear')?.addEventListener('click',()=>{selected={};persistQueue();render()});$('#fetch-points')?.addEventListener('click',()=>fetchPoints(items.map(p=>p.id)));bindCards()}
function productGender(p){let label=lang==='no'?{men:'Herre',woman:'Dame',unisex:'Unisex'}[p.gender]:{men:'Men’s',woman:'Women’s',unisex:'Unisex'}[p.gender];return label?'<div class="product-gender">'+esc(label)+'</div>':''}
function card(p){let v=variant(p),q=selected[p.id];let picture='<button class="picture" data-picture aria-label="'+esc(mode==='images'?t('replace'):p.name)+'">'+(v?'<img src="'+image(v)+'" alt="'+esc(p.name)+'" loading="lazy">':t('noImage'))+(mode==='images'?'<span>'+t('replace')+'</span>':'')+'</button>';let body=productGender(p)+'<h3>'+esc(p.name)+'</h3><p class="sub">'+esc(v?.name||p.style)+'</p>';
if(mode==='images'){body+='<label>'+t('url')+'<input type="url" data-url placeholder="'+t('urlHint')+'" value="'+esc(pending[key(p,v)]?.url||'')+'"></label><details><summary>'+t('moreColours')+'</summary><div class="colours">'+p.variants.map(x=>'<button data-variant="'+x.id+'" class="'+(x.id===v?.id?'active':'')+'" title="'+esc(x.name)+'"><img src="'+image(x)+'" alt="'+esc(x.name)+'"></button>').join('')+'</div>'+(v?'<label>'+t('colourName')+'<input data-colour value="'+esc(v.name)+'"></label>':'')+'<button data-add>'+t('addColour')+'</button><p style="margin-top:14px"><a href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent('Klattermusen '+p.name+' '+p.style+' product flatlay')+'" target="_blank" rel="noreferrer">'+t('find')+' ↗</a></p><button data-suggest>'+t('alternatives')+'</button><div class="candidates"></div></details>'}
if(mode==='print'){body+='<div class="quantity"><label>'+t('copies')+'</label><button data-minus aria-label="-">−</button><input type="number" min="0" max="500" data-qty value="'+qty(p)+'" aria-label="'+t('copies')+'"><button data-plus aria-label="+">+</button></div>';if(p.variants.length>1)body+='<details><summary>'+t('printColours')+'</summary><label><input type="checkbox" data-alternate '+(q?.mode==='alternate'?'checked':'')+'> '+t('alternate')+'</label>'+p.variants.map(x=>'<label>'+esc(x.name)+'<input type="number" min="0" max="500" data-colour-qty="'+x.id+'" value="'+(q?.counts?.[x.id]||0)+'" '+(q?.mode==='alternate'?'disabled':'')+'></label>').join('')+'</details>'}
if(mode==='info'){picture='';body=productGender(p)+'<h3>'+esc(p.name)+'</h3><p class="sub">'+esc(p.feature_status==='error'?(p.feature_error||'Could not fetch product page'):p.features?.some(Boolean)?(lang==='no'?'Salgspunkter lagret · kontroller før bruk':'Talking points saved · review before use'):(lang==='no'?'Venter på salgspunkter':'Waiting for talking points'))+'</p><div class="info-fields">'+[0,1,2].map(i=>'<label>'+t('point')+' '+(i+1)+'<input maxlength="240" data-point="'+i+'" value="'+esc(p.features?.[i]||'')+'"></label>').join('')+'</div>'+(p.feature_drafts?.length?'<div class="draft"><strong>'+t('draft')+'</strong><small>'+esc(p.feature_page_name||'')+'</small>'+p.feature_drafts.map(x=>'<p>'+esc(x)+'</p>').join('')+'<button data-accept>'+t('useDraft')+'</button></div>':'')+'<details><summary>'+t('metadata')+'</summary><label>'+t('name')+'<input data-name value="'+esc(p.name)+'"></label><label>'+t('source')+'<input data-source value="'+esc(p.source||'')+'"></label>'+(p.feature_source?'<a href="'+esc(p.feature_source)+'" target="_blank" rel="noreferrer">'+esc((p.feature_date||'').slice(0,10))+' ↗</a>':'')+'</details>'}
let pick=mode==='print'?'<label class="queue-pick"><input type="checkbox" data-select '+(qty(p)>0?'checked':'')+' '+(!p.variants.length?'disabled':'')+'> <span>'+t(qty(p)>0?'inQueue':'addQueue')+'</span></label>':'';return '<article class="card '+(mode==='print'&&qty(p)>0?'selected':'')+'" data-id="'+p.id+'" data-gender="'+esc(p.gender)+'">'+pick+picture+'<div class="body">'+body+'</div></article>'}
function bindCards(){document.querySelectorAll('[data-id]').forEach(el=>{let p=db.products.find(p=>p.id===el.dataset.id),v=variant(p);el.querySelector('[data-select]')?.addEventListener('change',()=>toggle(p));el.querySelector('[data-picture]')?.addEventListener('click',()=>{if(mode==='print')toggle(p);else{uploadContext={id:p.id,variant:v?.id,remove:removeBg};$('#imagefile').click()}});el.querySelector('[data-url]')?.addEventListener('input',e=>{let k=key(p,v);if(e.target.value.trim())pending[k]={key:k,id:p.id,variant:v?.id,url:e.target.value.trim()};else delete pending[k];mark()});el.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{active[p.id]=b.dataset.variant;render();document.querySelector('[data-id="'+p.id+'"] details').open=true});el.querySelector('[data-colour]')?.addEventListener('input',e=>{v.name=e.target.value;mark()});el.querySelector('[data-add]')?.addEventListener('click',()=>{uploadContext={id:p.id,remove:removeBg};$('#imagefile').click()});el.querySelector('[data-suggest]')?.addEventListener('click',async e=>{e.target.disabled=true;try{let r=await job('candidates',{id:p.id}),box=el.querySelector('.candidates');box.innerHTML=r.options.map((o,i)=>'<button data-option="'+i+'"><img src="'+esc(o.preview)+'" alt="">'+t('replace')+'</button>').join('')||'<small>'+t('noAlternatives')+'</small>';box.querySelectorAll('button').forEach(b=>b.onclick=()=>{let o=r.options[Number(b.dataset.option)],k=key(p,v);pending[k]={key:k,id:p.id,variant:v?.id,url:o.url};el.querySelector('[data-url]').value=o.url;mark()})}catch(e){toast(e.message,true)}finally{e.target.disabled=false}});
function setQty(n){if(!selected[p.id]&&p.variants.length)selected[p.id]={mode:'exact',counts:{}};setTotal(p,n);el.querySelector('[data-qty]').value=qty(p);el.classList.toggle('selected',qty(p)>0);let pick=el.querySelector('[data-select]');if(pick){pick.checked=qty(p)>0;pick.nextElementSibling.textContent=t(qty(p)>0?'inQueue':'addQueue');}el.querySelectorAll('[data-colour-qty]').forEach(i=>i.value=selected[p.id]?.counts?.[i.dataset.colourQty]||0)}el.querySelector('[data-plus]')?.addEventListener('click',()=>setQty(qty(p)+1));el.querySelector('[data-minus]')?.addEventListener('click',()=>setQty(qty(p)-1));el.querySelector('[data-qty]')?.addEventListener('input',e=>setQty(e.target.value));el.querySelector('[data-alternate]')?.addEventListener('change',e=>{let n=qty(p)||1;selected[p.id]={mode:e.target.checked?'alternate':'exact',count:n,counts:{[v?.id]:n}};persistQueue();render();document.querySelector('[data-id="'+p.id+'"] details').open=true});el.querySelectorAll('[data-colour-qty]').forEach(i=>i.oninput=()=>{selected[p.id]??={mode:'exact',counts:{}};selected[p.id].counts??={};selected[p.id].counts[i.dataset.colourQty]=Math.max(0,Math.min(500,Number(i.value)||0));persistQueue();el.querySelector('[data-qty]').value=qty(p);el.classList.toggle('selected',qty(p)>0)});el.querySelectorAll('[data-point]').forEach(i=>i.oninput=()=>{p.features??=[];p.features[Number(i.dataset.point)]=i.value;mark()});for(let field of ['name','source'])el.querySelector('[data-'+field+']')?.addEventListener('input',e=>{p[field]=e.target.value;mark()});el.querySelector('[data-accept]')?.addEventListener('click',()=>{p.features=[...p.feature_drafts];p.feature_drafts=[];mark();render()})})}
async function fetchPoints(ids){try{await saveText();toast(t('featureWorking'));let result=await job('features',{ids});await refresh();render();let errors=result.filter(r=>!r.status.startsWith('Draft ready'));toast(errors.length?errors.map(x=>x.name+': '+x.status).join('\n'):t('ready'),!!errors.length)}catch(e){toast(e.message,true)}}
$('#imagefile').onchange=async e=>{try{let files=[...e.target.files];if(!files.length)return;await saveText();toast(t('loading'));for(let [i,f] of files.entries()){if(f.size>15*1024*1024)throw Error('Max 15 MB per image');let r=await job('images',{items:[{...uploadContext,variant:i===0?uploadContext.variant:null,name:'',data:await file64(f)}]});if(r[0].error)throw Error(r[0].error)}await refresh();render();toast(t('replaceDone'))}catch(e){toast(e.message,true)}finally{e.target.value=''}};
function opt(value,label,current){return '<option value="'+esc(value)+'" '+(value===current?'selected':'')+'>'+esc(label)+'</option>'}

function design(){let fontOptions=db.fonts.filter(f=>f!=='RotisSemiSansPro_Regular.otf');let html='<button class="link" id="back">'+t('back')+'</button>'+intro(t('design'),t('universal'))+'<div class="design"><section class="panel"><h2>'+t('format')+'</h2><label><select id="format" data-setting="format">'+['card','compact','shelf','custom'].map(f=>opt(f,t(f),settings.format)).join('')+'</select></label>'+(settings.format==='custom'?'<div class="fields">'+setting('width',t('width'),'number','min="30" max="281"')+setting('height',t('height'),'number','min="15" max="194"')+'</div>':'')+'<details><summary>'+t('tweak')+'</summary><label>'+t('font')+'<select data-setting="font">'+fontOptions.map(f=>opt(f,f==='RotisSemiSansPro-Bold.otf'?t('rotis'):f.replace(/\.(otf|ttf|woff2?)$/i,''),settings.font)).join('')+'</select></label>'+setting('fontSize',t('fontSize'),'number','min="10" max="64"')+'<label>'+t('palette')+'<select data-setting="palette">'+[['gender','genderColours'],['mono','mono'],['custom','customColours']].map(([v,k])=>opt(v,t(k),settings.palette)).join('')+'</select></label><div class="fields">'+setting('background',t('background'),'color')+setting('text',t('text'),'color')+'</div>'+setting('badge',t('badge'),'checkbox')+setting('colour',t('showColour'),'checkbox')+setting('features',t('showFeatures'),'checkbox')+setting('start',t('start'),'number','min="1"')+'</details><details><summary>'+t('exceptions')+'</summary><label><input id="exceptions" type="checkbox" '+(allowOverrides?'checked':'')+'> '+t('enableExceptions')+'</label><small>'+t('exceptionsHelp')+'</small><div id="overrides" '+(allowOverrides?'':'class="hidden"')+'>'+db.products.filter(p=>selected[p.id]&&qty(p)>0).map(p=>'<div class="override-row"><label>'+esc(p.name)+'<input data-override-name="'+p.id+'" placeholder="'+t('name')+'" value="'+esc(selected[p.id].override?.name||'')+'"></label><label>'+t('fontSize')+'<input type="number" min="10" max="64" data-override-size="'+p.id+'" placeholder="'+settings.fontSize+'" value="'+esc(selected[p.id].override?.fontSize||'')+'"></label></div>').join('')+'</div></details></section><section><div class="row between preview-note"><span>'+t('previewHint')+'</span><a id="full-preview" target="_blank" class="hidden">'+t('fullPreview')+' ↗</a></div><div id="preview-status">'+t('loading')+'</div><iframe class="preview" id="preview" title="'+t('design')+'"></iframe></section></div>';$('#app').innerHTML=html;$('#back').onclick=()=>{mode='print';render()};document.querySelectorAll('[data-setting]').forEach(i=>i.onchange=()=>{settings[i.dataset.setting]=i.type==='checkbox'?i.checked:i.value;if(i.dataset.setting==='format'){settings.fontSize=i.value==='card'?26:18;design();updateBar()}else schedulePreview()});$('#exceptions').onchange=e=>{allowOverrides=e.target.checked;$('#overrides').classList.toggle('hidden',!allowOverrides);schedulePreview()};document.querySelectorAll('[data-override-name],[data-override-size]').forEach(i=>i.oninput=()=>{let id=i.dataset.overrideName||i.dataset.overrideSize;selected[id].override??={};selected[id].override[i.dataset.overrideName?'name':'fontSize']=i.value;persistQueue();schedulePreview()});schedulePreview(0)}
function request(){return {settings,allowOverrides,items:Object.entries(selected).map(([id,q])=>({id,...q})).filter(x=>db.products.some(p=>p.id===x.id))}}

ast(e.message,true)}};$('#new-product').onclick=()=>openProducts('one')}

function categoryOptions(value,blank=false){return (blank?'<option value="">'+pt('Choose category','Velg kategori')+'</option>':'')+productCategories().map(c=>opt(c,c==='Other'?pt('Other','Annet'):c==='bag'?pt('Bags','Vesker'):cat(c),value)).join('')}
async function openProducts(tab='one'){if(dirty){await saveAll();if(dirty)return}$('#dialog').close();productTab=tab;mode='products';query='';render()}
function productNav(){return '<div class="product-tabs" role="group" aria-label="'+pt('Product tools','Produktverktøy')+'">'+[['one','Add one','Legg til ett'],['batch','Add several','Legg til flere'],['manage','Manage products','Administrer produkter']].map(([v,en,no])=>'<button data-product-tab="'+v+'" class="'+(productTab===v?'primary':'')+'">'+pt(en,no)+'</button>').join('')+'</div>'}
function productRender(){let html=intro(pt('Your products','Dine produkter'),pt('Add individual products, add a batch, or remove products you no longer need.','Legg til enkeltprodukter, legg til flere samtidig, eller fjern produkter du ikke trenger.'))+productNav();if(productTab==='one')html+=productOne();if(productTab==='batch')html+=productBatch();if(productTab==='manage')html+=productManage();$('#app').innerHTML=html;document.querySelectorAll('[data-product-tab]').forEach(b=>b.onclick=()=>{productTab=b.dataset.productTab;render()});if(productTab==='one')bindProductOne();if(productTab==='batch')bindProductBatch();if(productTab==='manage')bindProductManage()}
function productOne(){return '<form id="product-one" class="panel product-form"><div class="fields"><label class="wide">'+t('name')+'<input name="name" required maxlength="160" autocomplete="off"></label><label>'+pt('Gender','Kjønn')+'<select name="gender" required>'+genderOptions('',true)+'</select></label><label>'+pt('Category','Kategori')+'<select name="category" required>'+categoryOptions('',true)+'</select></label><label class="wide">'+pt('Product picture','Produktbilde')+'<input name="picture" type="file" accept="image/*"><img id="one-image-preview" class="one-preview hidden" alt="'+pt('Chosen picture','Valgt bilde')+'"></label><label class="wide">'+pt('Or paste a direct image URL','Eller lim inn en direkte bildeadresse')+'<input name="url" type="url" placeholder="https://…"></label></div><details><summary>'+pt('Optional details','Valgfrie detaljer')+'</summary><div class="fields"><label>'+pt('Style number','Modellnummer')+'<input name="style" maxlength="80"></label><label>'+t('colourName')+'<input name="colour" maxlength="80"></label><label class="wide">'+t('source')+'<input name="source" type="url" placeholder="https://www.klattermusen.com/…"></label>'+[0,1,2].map(i=>'<label class="wide">'+t('point')+' '+(i+1)+'<input name="feature'+i+'" maxlength="240"></label>').join('')+'</div></details><p class="sub" style="margin-top:20px">'+pt('You can add or change the picture later in Change pictures.','Du kan legge til eller endre bildet senere under Bytt bilder.')+'</p><button class="primary" type="submit">'+pt('Add product','Legg til produkt')+'</button><p id="one-error" role="alert" class="product-error"></p></form>'}
function bindProductOne(){let form=$('#product-one');form.elements.picture.onchange=()=>{let file=form.elements.picture.files[0];$('#one-image-preview').classList.toggle('hidden',!file);if(file)$('#one-image-preview').src=URL.createObjectURL(file)};form.onsubmit=async e=>{e.preventDefault();if(productWorking||!form.reportValidity())return;productWorking=true;let b=form.querySelector('[type=submit]');b.disabled=true;$('#one-error').textContent='';try{let f=form.elements.picture.files[0];if(f?.size>15*1024*1024)throw Error(pt('Maximum 15 MB per image','Maks 15 MB per bilde'));let item={key:'one',name:form.elements.name.value,gender:form.elements.gender.value,category:form.elements.category.value,style:form.elements.style.value,colour:form.elements.colour.value,source:form.elements.source.value,url:f?'':form.elements.url.value.trim(),features:[0,1,2].map(i=>form.elements['feature'+i].value)};if(f)item.data=await file64(f);let [r]=await api('add-products',{items:[item]});if(!r.ok)throw Error(r.error);await refresh();productTab='manage';manageQuery=item.name;manageGender='';render();toast(pt('Product added','Produkt lagt til'))}catch(e){$('#one-error').textContent=e.message}finally{productWorking=false;b.disabled=false}}}
function batchRow(name='',file=null){return {key:crypto.randomUUID(),name,gender:batchGender,category:batchCategory,style:'',url:'',file,error:'',preview:file?URL.createObjectURL(file):''}}
function productBatch(){return '<section class="panel"><h2>'+pt('Add several products','Legg til flere produkter')+'</h2><p class="muted">'+pt('Choose pictures to create one row per file, or paste a list from Excel / Numbers. Review each row before adding.','Velg bilder for å lage én rad per fil, eller lim inn en liste fra Excel / Numbers. Kontroller hver rad før du legger til.')+'</p><div class="fields product-defaults"><label>'+pt('Gender for new rows','Kjønn for nye rader')+'<select id="batch-gender">'+genderOptions(batchGender)+'</select></label><label>'+pt('Category for new rows','Kategori for nye rader')+'<select id="batch-category">'+categoryOptions(batchCategory)+'</select></label></div><div class="row"><button id="batch-pictures">'+pt('Choose multiple pictures','Velg flere bilder')+'</button><button id="batch-add-row">'+pt('Add a row','Legg til rad')+'</button><button class="link" id="batch-apply">'+pt('Apply gender & category to all rows','Bruk kjønn og kategori på alle rader')+'</button></div><input id="batch-image-files" type="file" accept="image/*" multiple hidden><details><summary>'+pt('Paste a spreadsheet or CSV','Lim inn fra regneark eller CSV')+'</summary><p class="sub">'+pt('Columns: Name, Gender, Category, Style, Image URL. A header row is optional. Gender: men, women or unisex. Empty gender/category uses the choices above.','Kolonner: Name, Gender, Category, Style, Image URL. Overskriftsrad er valgfri. Kjønn: men, women eller unisex. Tomt kjønn/kategori bruker valgene over.')+'</p><textarea id="batch-paste" rows="5" placeholder="Drifa Zip Vest\twomen\tvest\t10618\thttps://…"></textarea><p><button id="batch-read">'+pt('Add rows from list','Legg til rader fra listen')+'</button></p></details><div class="batch-table-wrap"><table class="batch-table"><thead><tr><th>'+t('name')+'</th><th>'+pt('Gender','Kjønn')+'</th><th>'+pt('Category','Kategori')+'</th><th>'+pt('Style','Modellnr.')+'</th><th>'+pt('Picture / URL','Bilde / URL')+'</th><th></th></tr></thead><tbody>'+batchRows.map(r=>'<tr data-batch-row="'+r.key+'"><td><input data-field="name" value="'+esc(r.name)+'" aria-label="'+t('name')+'" maxlength="160">'+(r.error?'<small class="product-error" role="alert">'+esc(r.error)+'</small>':'')+'</td><td><select data-field="gender" aria-label="'+pt('Gender','Kjønn')+'">'+genderOptions(r.gender)+'</select></td><td><select data-field="category" aria-label="'+pt('Category','Kategori')+'">'+categoryOptions(r.category)+'</select></td><td><input data-field="style" value="'+esc(r.style)+'" aria-label="'+pt('Style','Modellnr.')+'" maxlength="80"></td><td><div class="batch-image">'+(r.file?'<img src="'+r.preview+'" alt=""><span>'+esc(r.file.name)+'</span>':'<input type="url" data-field="url" value="'+esc(r.url)+'" placeholder="https://…" aria-label="'+pt('Image URL','Bildeadresse')+'">')+'<label class="batch-upload" title="'+pt('Choose picture','Velg bilde')+'">'+pt('Choose','Velg')+'<input type="file" accept="image/*" data-batch-file></label></div></td><td><button class="link" data-batch-remove aria-label="'+pt('Remove row','Fjern rad')+'">×</button></td></tr>').join('')+'</tbody></table></div>'+(!batchRows.length?'<p class="sub" style="margin-top:20px">'+pt('No rows yet. Choose pictures or add a row to start.','Ingen rader ennå. Velg bilder eller legg til en rad.')+'</p>':'')+'<div class="row between product-actions"><span>'+batchRows.length+' / 100 '+pt('products','produkter')+'</span><button id="batch-save" class="primary" '+(!batchRows.length?'disabled':'')+'>'+pt('Add','Legg til')+' '+batchRows.length+' '+pt('products','produkter')+'</button></div><p id="batch-message" class="product-error" role="alert"></p></section>'}
function parseProductRows(text){let delimiter=text.includes('\t')?'\t':text.split(/\r?\n/)[0]?.includes(';')?';':',',rows=[],row=[],value='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===delimiter&&!quoted){row.push(value.trim());value=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value.trim());if(row.some(Boolean))rows.push(row);row=[];value=''}else value+=c}row.push(value.trim());if(row.some(Boolean))rows.push(row);if(quoted)throw Error(pt('Close the quotation marks in your list','Lukk anførselstegnene i listen'));let first=(rows[0]||[]).map(x=>x.toLowerCase().replace(/^\uFEFF/,'')),headers=first.some(x=>['name','product name','produktnavn'].includes(x));let index=headers?first:['name','gender','category','style','image url'];if(headers)rows.shift();let valueAt=(r,names)=>r[index.findIndex(x=>names.includes(x))]||'';return rows.map(r=>{let name=valueAt(r,['name','product name','produktnavn']),gender=valueAt(r,['gender','kjønn']).toLowerCase(),category=valueAt(r,['category','kategori']);gender=({women:'woman',female:'woman',dame:'woman',woman:'woman',men:'men',male:'men',herre:'men',unisex:'unisex'}[gender])||gender||batchGender;let catAliases={jackets:'jakke',jacket:'jakke',trousers:'bukse',pants:'bukse',midlayers:'genser',tops:'overdel',backpacks:'sekk',bags:'bag',accessories:'tilbehør',vests:'vest',other:'Other'};category=catAliases[category.toLowerCase()]||category||batchCategory;if(!['men','woman','unisex'].includes(gender))throw Error(pt('Unknown gender for ','Ukjent kjønn for ')+name);if(!productCategories().includes(category))throw Error(pt('Unknown category for ','Ukjent kategori for ')+name);return {...batchRow(name),gender,category,style:valueAt(r,['style','style number','modellnummer','modellnr.']),url:valueAt(r,['image url','url','bildeadresse'])}})}
function bindProductBatch(){function defaults(){batchGender=$('#batch-gender').value;batchCategory=$('#batch-category').value}$('#batch-gender').onchange=defaults;$('#batch-category').onchange=defaults;$('#batch-apply').onclick=()=>{defaults();batchRows.forEach(r=>{r.gender=batchGender;r.category=batchCategory});render()};$('#batch-add-row').onclick=()=>{defaults();if(batchRows.length>=100)return toast(pt('Maximum 100 products per batch','Maks 100 produkter per batch'),true);batchRows.push(batchRow());render()};$('#batch-pictures').onclick=()=>$('#batch-image-files').click();$('#batch-image-files').onchange=e=>{defaults();let fs=[...e.target.files];if(batchRows.length+fs.length>100)return toast(pt('Maximum 100 products per batch','Maks 100 produkter per batch'),true);fs.forEach(f=>batchRows.push(batchRow(f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim(),f)));render()};$('#batch-read').onclick=()=>{try{defaults();let rows=parseProductRows($('#batch-paste').value);if(batchRows.length+rows.length>100)throw Error(pt('Maximum 100 products per batch','Maks 100 produkter per batch'));batchRows.push(...rows);render()}catch(e){toast(e.message,true)}};document.querySelectorAll('[data-batch-row]').forEach(el=>{let r=batchRows.find(x=>x.key===el.dataset.batchRow);el.querySelectorAll('[data-field]').forEach(i=>i.oninput=()=>{r[i.dataset.field]=i.value;r.error=''});el.querySelector('[data-batch-remove]').onclick=()=>{batchRows=batchRows.filter(x=>x.key!==r.key);if(r.preview)URL.revokeObjectURL(r.preview);render()};el.querySelector('[data-batch-file]').onchange=e=>{let f=e.target.files[0];if(!f)return;if(r.preview)URL.revokeObjectURL(r.preview);r.file=f;r.preview=URL.createObjectURL(f);r.url='';render()}});$('#batch-save').onclick=async()=>{if(productWorking)return;productWorking=true;$('#app').classList.add('busy');try{let added=0;for(let r of [...batchRows]){toast(pt('Adding products','Legger til produkter')+' '+(added+1)+' / '+batchRows.length);try{if(r.file?.size>15*1024*1024)throw Error(pt('Maximum 15 MB per image','Maks 15 MB per bilde'));let item={key:r.key,name:r.name,gender:r.gender,category:r.category,style:r.style,url:r.file?'':r.url.trim()};if(r.file)item.data=await file64(r.file);let [res]=await api('add-products',{items:[item]});if(!res.ok)throw Error(res.error);r.added=true;added++}catch(e){r.error=e.message}}batchRows=batchRows.filter(r=>{if(r.added&&r.preview)URL.revokeObjectURL(r.preview);return !r.added});await refresh();render();toast(added+' '+pt('products added','produkter lagt til')+(batchRows.length?' · '+batchRows.length+' '+pt('rows need attention','rader må kontrolleres'):''),!!batchRows.length)}catch(e){toast(e.message,true)}finally{productWorking=false;$('#app').classList.remove('busy')}}}
function productManage(){let ps=db.products.filter(p=>(!manageGender||p.gender===manageGender)&&(!manageQuery||(p.name+' '+p.style).toLowerCase().includes(manageQuery.toLowerCase())));return '<input id="manage-search" class="search" type="search" placeholder="'+t('search')+'" value="'+esc(manageQuery)+'"><div class="row product-filters">'+['','men','woman','unisex'].map(g=>'<button data-manage-gender="'+g+'" class="'+(manageGender===g?'primary':'')+'">'+(g?t(g):t('viewAll'))+'</button>').join('')+'</div><div class="row between product-actions"><label><input id="manage-all" type="checkbox" '+(ps.length&&ps.every(p=>manageSelected.has(p.id))?'checked':'')+'> '+pt('Select shown','Velg viste')+'</label><button id="manage-delete" '+(!manageSelected.size?'disabled':'')+'>'+pt('Delete selected','Slett valgte')+' ('+manageSelected.size+')</button></div><p class="sub">'+pt('Deleted products can be restored below. They are also removed from the print queue.','Slettede produkter kan gjenopprettes under. De fjernes også fra utskriftskøen.')+'</p><div class="product-list">'+ps.map(p=>'<label class="product-list-row"><input type="checkbox" data-manage-id="'+p.id+'" '+(manageSelected.has(p.id)?'checked':'')+'>'+(p.variants[0]?'<img src="'+image(p.variants[0])+'" alt="" loading="lazy">':'<span class="product-no-picture">▧</span>')+'<span><strong>'+esc(p.name)+'</strong><small>'+esc(t(p.gender)+' · '+cat(p.category)+(p.style?' · '+p.style:''))+'</small></span></label>').join('')+'</div>'+(!ps.length?'<div class="empty">'+t('noResults')+'</div>':'')+'<details><summary>'+pt('Deleted products','Slettede produkter')+' ('+(db.trash||[]).length+')</summary>'+((db.trash||[]).length?'<button id="restore-all">'+pt('Restore all','Gjenopprett alle')+'</button>':'')+'<div class="product-list">'+(db.trash||[]).map(x=>'<div class="product-list-row"><span><strong>'+esc(x.product.name)+'</strong><small>'+esc(t(x.product.gender)+' · '+cat(x.product.category))+'</small></span><button data-restore-id="'+x.product.id+'">'+pt('Restore','Gjenopprett')+'</button></div>').join('')+'</div></details>'}
async function productRestore(ids){try{await api('restore-products',{ids});await refresh();selected=db.queue||{};render();toast(pt('Products restored','Produktene er gjenopprettet'))}catch(e){toast(e.message,true)}}
function bindProductManage(){$('#manage-search').oninput=e=>{manageQuery=e.target.value;clearTimeout(window.manageSearchTimer);window.manageSearchTimer=setTimeout(()=>{render();let i=$('#manage-search');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)};document.querySelectorAll('[data-manage-gender]').forEach(b=>b.onclick=()=>{manageGender=b.dataset.manageGender;render()});document.querySelectorAll('[data-manage-id]').forEach(i=>i.onchange=()=>{if(i.checked)manageSelected.add(i.dataset.manageId);else manageSelected.delete(i.dataset.manageId);$('#manage-delete').disabled=!manageSelected.size;$('#manage-delete').textContent=pt('Delete selected','Slett valgte')+' ('+manageSelected.size+')'});$('#manage-all').onchange=e=>{let ids=[...document.querySelectorAll('[data-manage-id]')].map(i=>i.dataset.manageId);ids.forEach(id=>e.target.checked?manageSelected.add(id):manageSelected.delete(id));render()};$('#manage-delete').onclick=async()=>{if(productWorking||!manageSelected.size)return;productWorking=true;try{await api('save',{queue:selected});let ids=[...manageSelected];await api('delete-products',{ids});ids.forEach(id=>{for(let k of Object.keys(pending))if(pending[k].id===id)delete pending[k]});manageSelected.clear();await refresh();selected=db.queue||{};render();toast(pt('Products deleted. Restore them under Deleted products.','Produktene er slettet. Gjenopprett dem under Slettede produkter.'))}catch(e){toast(e.message,true)}finally{productWorking=false}};document.querySelectorAll('[data-restore-id]').forEach(b=>b.onclick=()=>productRestore([b.dataset.restoreId]));$('#restore-all')?.addEventListener('click',()=>productRestore((db.trash||[]).map(x=>x.product.id)))}

(async()=>{try{await refresh();selected=db.queue||{};settings={format:'card',font:'RotisSemiSansPro-Bold.otf',fontSize:26,width:90,height:100,palette:'gender',background:'#ffffff',text:'#172d21',badge:true,colour:false,features:false,start:1,...db.settings};if(!db.simpleUI){settings.font='RotisSemiSansPro-Bold.otf';await api('save',{settings,simpleUI:true})}render()}catch(e){toast(e.message,true)}})();
</script></body></html>
